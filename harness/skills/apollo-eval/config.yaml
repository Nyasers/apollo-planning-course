# Apollo EDU 赛事环境配置
# 单一事实来源：版本要求和 URL 配置
# 与 apollo-env / apollo-dev 共享基础配置，追加 eval 专用字段

# 版本
version: "EDU"

# 支持的操作系统
os_supported: "Ubuntu 18.04, Ubuntu 20.04, Ubuntu 22.04"

# 最低版本要求
docker_min: "19.03"

# 硬件要求
disk_min_gb: "55"
memory_min_gb: "16"
cpu_min_cores: "4"

# 安装方式
install_method: "aem"

# Docker 安装脚本（Apollo 定制版）
docker_install_url: "http://apollo-pkg-beta.bj.bcebos.com/docker_install.sh"
docker_install_mirror_url: "http://apollo-pkg-beta.bj.bcebos.com/get_docker.sh"

# apt 源
apt_source: "https://apollo-pkg-beta.cdn.bcebos.com/apollo/core"

# DreamView
dreamview_port: "8888"

# 构建命令
build_cmd: "buildtool build -p core"

# 赛事工程（固定为 PnC）
example_projects: "application-pnc"

# GPG keys and URLs
apollo_gpg_url: "https://apollo-pkg-beta.cdn.bcebos.com/neo/beta/key/deb.gpg.key"
apollo_gpg_keyring: "/etc/apt/keyrings/apolloauto.gpg"
apollo_apt_list: "/etc/apt/sources.list.d/apolloauto.list"

# 赛事编译缓存
cache_url: "https://apollo-system.bj.bcebos.com/bazel_deps/cache.tar.gz"
planning_cache_url: "https://apollo-pkg-beta.bj.bcebos.com/archive/planning_cache.tar.gz"

# 网络检测端点
network_check_url: "https://apollo-pkg-beta.cdn.bcebos.com"
network_check_github: "https://github.com"
network_check_timeout: "5"

# ==== apollo-eval 专用 ====

# 体感指标阈值（赛事参考标准）
eval_lon_accel_max: "3.0"      # 纵向加速度上限 m/s²
eval_lon_jerk_max: "4.0"       # 纵向加速度变化率上限 m/s³
eval_lat_accel_max: "2.0"      # 横向加速度上限 m/s²
eval_hard_brake_threshold: "4.0"  # 急刹车判定阈值 m/s²（减速度绝对值）

# cyber record 日志路径（容器内）
cyber_record_path: "/apollo_workspace/data/bag"
apollo_log_path: "/apollo_workspace/data/log"
